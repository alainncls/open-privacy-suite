services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=privacy_proxy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Anvil (Foundry's local Ethereum node)
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    ports:
      - "127.0.0.1:8545:8545"
    # --steps-tracing enables debug_traceCall support for runtime validation
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--steps-tracing"]
    networks:
      internal:
      shared:
        aliases:
          - privacy-proxy-anvil
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Privacy proxy backend
  proxy-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      - NODE_URL=${NODE_URL:-http://anvil:8545}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/privacy_proxy?sslmode=disable
      - PORT=8080
      - ENVIRONMENT=development
      - VERIFIER_ID=did:privado:verifier:dev-0000000000000000
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production-1234567890}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-do-not-use-in-production-0987654321}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - MOCK_SIGNATURES=true  # Allow mock signatures for demo recordings (never enable in production)
      - ALLOW_MOCK_LOGIN=true  # Allow mock JWZ tokens for dev/testing (never enable in production)
      - DEMO_AUTO_AUTH_DELAY=${DEMO_AUTO_AUTH_DELAY:-}  # Auto-complete auth after N seconds for demos (empty = disabled)
      - ENABLE_RUNTIME_TRACING=true  # Enable runtime tracing for cross-org isolation validation (validates dynamic calls at execution time)
      - ENABLE_TRAVEL_RULE=true  # Enable travel rule compliance enforcement (threshold-based transfer checks)
      - DISABLE_COINGECKO=${DISABLE_COINGECKO:-false}  # Set true to disable CoinGecko price fetching
      - EXPLORER_DATABASE_URL=${EXPLORER_DATABASE_URL:-}
      - FRONTEND_URL=http://localhost:5173
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID:-}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET:-}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    networks:
      internal:
      shared:
        aliases:
          - privacy-proxy-backend
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Frontend dev server
  proxy-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_TARGET=http://proxy-backend:8080
      - VITE_BACKEND_URL=http://localhost:${BACKEND_HOST_PORT:-8080}
      - VITE_ALLOW_MOCK_LOGIN=true
      # SECURITY: Do NOT pass ADMIN_API_TOKEN to the frontend — it would be
      # visible in the browser. Use JWT-based admin auth or paste the token
      # into the browser console / localStorage for bootstrap only.
    depends_on:
      proxy-backend:
        condition: service_started
    networks:
      - internal

volumes:
  postgres-data:

networks:
  # Internal network — privacy-proxy services only (postgres, backend, anvil, frontend)
  internal:
    driver: bridge
  # Shared network — block-explorer connects here to reach backend and anvil
  shared:
    name: privacy-proxy_proxy-network
    driver: bridge
