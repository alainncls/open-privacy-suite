# E2E test configuration - runs in complete isolation from local dev
# Usage: docker-compose -p privacy-proxy-e2e -f docker-compose.e2e.yml up -d --build
#
# Key differences from dev docker-compose.yml:
# 1. Uses isolated project name (privacy-proxy-e2e) via Makefile -p flag
# 2. Uses anonymous volume for postgres (not shared with dev)
# 3. No host port mappings - services communicate only via internal network
# 4. Ephemeral - all data destroyed on `docker-compose down -v`

services:
  # PostgreSQL database - isolated instance for E2E
  postgres:
    image: postgres:15-alpine
    # No port mapping - only accessible within e2e network
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=privacy_proxy
    # Anonymous volume - data is ephemeral, destroyed on down -v
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data
    networks:
      - e2e-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Anvil (Foundry's local Ethereum node)
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # No port mapping
    networks:
      - e2e-network
    # --steps-tracing enables debug_traceCall support for runtime validation
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--steps-tracing"]
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Privacy proxy backend
  proxy-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    # No port mapping - only playwright container needs access
    environment:
      - NODE_URL=http://anvil:8545
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/privacy_proxy?sslmode=disable
      - PORT=8080
      - ENVIRONMENT=test
      - VERIFIER_ID=did:privado:verifier:e2e-test-verifier-0000000000000000
      - JWT_SECRET=e2e-test-jwt-secret-not-for-production
      - JWT_REFRESH_SECRET=e2e-test-refresh-secret-not-for-production
      - MOCK_SIGNATURES=true
      - ALLOW_MOCK_LOGIN=true
      - ENABLE_RUNTIME_TRACING=true
      - ENABLE_TRAVEL_RULE=true
      - ADMIN_API_TOKEN=e2e-test-admin-token
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    networks:
      - e2e-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Frontend (production build with nginx + API proxy to backend)
  proxy-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: e2e
      args:
        - VITE_ALLOW_MOCK_LOGIN=true
        - VITE_BACKEND_URL=http://proxy-backend:8080
    # No port mapping - only playwright container needs access
    depends_on:
      proxy-backend:
        condition: service_healthy
    networks:
      - e2e-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Playwright test runner
  playwright:
    build:
      context: ./e2e/playwright
      dockerfile: Dockerfile
    volumes:
      - ./e2e/playwright:/app
      - /app/node_modules
      - ./e2e/playwright/test-results:/app/test-results
      - ./e2e/playwright/playwright-report:/app/playwright-report
    environment:
      - PROXY_URL=http://proxy-backend:8080
      - ADMIN_URL=http://proxy-backend:8080
      - FRONTEND_URL=http://proxy-frontend:80
      - CI=${CI:-false}
      - ENABLE_RUNTIME_TRACING=true
      - ADMIN_API_TOKEN=e2e-test-admin-token
    depends_on:
      proxy-backend:
        condition: service_healthy
      proxy-frontend:
        condition: service_healthy
    networks:
      - e2e-network
    working_dir: /app

# Isolated volume - separate from dev
volumes:
  e2e-postgres-data:

# Isolated network - separate from dev
networks:
  e2e-network:
    driver: bridge
