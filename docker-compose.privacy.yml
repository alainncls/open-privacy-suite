# Privacy-mode deployment manifest for the Open Privacy Suite.
#
# This is the authoritative deployment for corporate / permissioned chains.
# It deliberately omits every component that could bypass privacy-proxy.
# If a service is missing here, that is on purpose — not oversight.
#
# See deployments/privacy/README.md for the trust-boundary rationale
# (RD-855).
#
# Quick start:
#   docker compose -f docker-compose.privacy.yml up -d
#
# This compose expects chain-indexer and block-explorer to be cloned as
# sibling repos of privacy-proxy (same parent directory). In production,
# replace the `build:` blocks with `image:` references to registry-hosted
# images.

services:
  # ----- Trust zone --------------------------------------------------------
  # Only privacy-proxy sits on both networks. Nothing else in the trust
  # zone is reachable from the public network.

  privacy-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PRIVACY_POSTGRES_PASSWORD:?PRIVACY_POSTGRES_PASSWORD is required in privacy mode}
      - POSTGRES_DB=privacy_proxy
    volumes:
      - privacy-postgres-data:/var/lib/postgresql/data
    networks:
      - trust-zone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d privacy_proxy"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in privacy mode}
    networks:
      - trust-zone
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required in privacy mode}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  anvil:
    # Development EVM node. In production, swap to an external RPC endpoint
    # and remove this service entirely — privacy-proxy already reaches it
    # via NODE_URL.
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--steps-tracing", "--block-time", "2"]
    networks:
      - trust-zone
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Chain-indexer owns its own postgres. Neither is reachable from the
  # public network — there is no path for a client to query the indexer
  # directly. Privacy-proxy is the sole consumer.
  indexer-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required in privacy mode}
      - POSTGRES_DB=chain_indexer
    volumes:
      - indexer-postgres-data:/var/lib/postgresql/data
    networks:
      - trust-zone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chain_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chain-indexer:
    # Build from the sibling chain-indexer repo. In production override
    # with an image reference:
    #   image: ghcr.io/gateway-fm/chain-indexer:${INDEXER_VERSION:-latest}
    build:
      context: ../chain-indexer
      dockerfile: Dockerfile
    environment:
      - RPC_URL=http://anvil:8545
      - DATABASE_URL=postgres://postgres:${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required in privacy mode}@indexer-postgres:5432/chain_indexer?sslmode=disable
      - GRPC_LISTEN_ADDR=:50051
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - POLL_INTERVAL=2s
      - ENABLE_TRACING=true
      - ENABLE_OP_DEPOSITS=${ENABLE_OP_DEPOSITS:-false}
    depends_on:
      indexer-postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    networks:
      - trust-zone
    restart: unless-stopped

  proxy-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    # Privacy-proxy is the only external-facing backend in privacy mode.
    # In production this would typically sit behind an ingress instead
    # of publishing directly; for local dev + the negative-network test
    # it's published to 127.0.0.1 only.
    ports:
      - "127.0.0.1:${HOST_PORT_PROXY:-8080}:8080"
    environment:
      - NODE_URL=http://anvil:8545
      - DATABASE_URL=postgres://postgres:${PRIVACY_POSTGRES_PASSWORD:?PRIVACY_POSTGRES_PASSWORD is required in privacy mode}@privacy-postgres:5432/privacy_proxy?sslmode=disable
      - PORT=8080
      - ENVIRONMENT=privacy
      - VERIFIER_ID=${VERIFIER_ID:-did:privado:verifier:dev-0000000000000000}
      - BASE_URL=${BASE_URL:-http://localhost:${HOST_PORT_PROXY:-8080}}
      # Browser-facing URL of the privacy-proxy admin UI. When set, the
      # OAuth /authorize endpoint redirects browser requests to the React
      # login page at FRONTEND_URL/login?oauth_session=… instead of
      # serving backend-rendered fallback HTML. Operators should override
      # for production deployments (e.g. https://proxy.yourdomain.com).
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${HOST_PORT_UI:-5173}}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in privacy mode}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required in privacy mode}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required in privacy mode (bootstrap admin credential)}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in privacy mode}@redis:6379
      - ENABLE_TRAVEL_RULE=true
      # Indexer integration — this is what flips privacy-proxy's explorer
      # backend from direct SQL to gRPC. The explorer postgres variable is
      # still accepted for standalone fallback (ABI writes, indexer
      # progress) per RD-855 behavioral-shifts doc, but in a pure privacy
      # deployment it points at the same indexer postgres read-only.
      - INDEXER_URL=chain-indexer:50051
      - EXPLORER_DATABASE_URL=postgres://postgres:${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required in privacy mode}@indexer-postgres:5432/chain_indexer?sslmode=disable
    depends_on:
      privacy-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chain-indexer:
        condition: service_started
    networks:
      - trust-zone
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ----- Public zone -------------------------------------------------------
  # Only user-facing SPAs live here. No backend, no database, no indexer.

  proxy-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "127.0.0.1:${HOST_PORT_UI:-5173}:80"
    environment:
      - VITE_API_TARGET=http://proxy-backend:8080
    depends_on:
      proxy-backend:
        condition: service_started
    networks:
      - public
    restart: unless-stopped

  # Block-explorer runs as frontend + a thin Backend-for-Frontend (BFF)
  # api. The BFF owns browser sessions (OAuth code flow against
  # privacy-proxy, HttpOnly cookies, contract verification) and proxies
  # chain-data reads to privacy-proxy's REST explorer surface, which
  # applies RBAC-based redaction.
  #
  # The BFF image is built with --target privacy, which compiles out the
  # chain-indexer gRPC client (Go build tag "privacy"). Even with env
  # vars flipped at runtime, the binary has no code path to reach
  # chain-indexer — the only data source it can talk to is
  # privacy-proxy. This is the compile-time layer of the three-layer
  # defense (compile-time + runtime + network) documented in
  # docs/rd-855-behavioral-shifts.md.

  block-explorer-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${BLOCK_EXPLORER_POSTGRES_PASSWORD:?BLOCK_EXPLORER_POSTGRES_PASSWORD is required in privacy mode}
      - POSTGRES_DB=explorer
    volumes:
      - block-explorer-postgres-data:/var/lib/postgresql/data
    networks:
      - trust-zone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d explorer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  block-explorer-api:
    # Build from the sibling block-explorer repo, privacy target.
    # In production override with an image reference:
    #   image: ghcr.io/gateway-fm/block-explorer-api:${EXPLORER_VERSION:-latest}-privacy
    build:
      # TEMP: pre-merge of block-explorer PR #60 — points at the
      # worktree that holds the "privacy" Dockerfile target. Revert to
      # `context: ../block-explorer/backend` after the PR merges.
      context: ../block-explorer/backend
      dockerfile: Dockerfile.api
      target: privacy
    environment:
      - DATABASE_URL=postgres://postgres:${BLOCK_EXPLORER_POSTGRES_PASSWORD:?BLOCK_EXPLORER_POSTGRES_PASSWORD is required in privacy mode}@block-explorer-postgres:5432/explorer?sslmode=disable
      - RPC_URL=http://proxy-backend:8080
      - API_PORT=8080
      # Privacy-build: INDEXER_URL is intentionally unset. The privacy
      # binary rejects it at startup anyway, but leaving it off here is
      # defense in depth against a compose-merge accident.
      - PRIVACY_PROXY_URL=http://proxy-backend:8080
      - PRIVACY_PROXY_PUBLIC_URL=${PRIVACY_PROXY_PUBLIC_URL:-http://localhost:${HOST_PORT_PROXY:-8080}}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-explorer}
      - SSO_REDIRECT_URI=${SSO_REDIRECT_URI:-http://localhost:${HOST_PORT_EXPLORER:-3001}/api/auth/callback}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      block-explorer-postgres:
        condition: service_healthy
      proxy-backend:
        condition: service_started
    networks:
      # Trust-zone only — not reachable from the host. The
      # block-explorer-frontend nginx sits on the same network and
      # is the only client.
      - trust-zone
    restart: unless-stopped

  # Block-explorer frontend — SPA served by nginx. The mounted nginx
  # config routes:
  #   /api/auth/*   -> block-explorer-api (OAuth flow, cookie set)
  #   /api/*        -> block-explorer-api (which forwards to privacy-proxy)
  #   /ws           -> 404 (subscriptions not supported in privacy mode)
  block-explorer-frontend:
    build:
      context: ../block-explorer/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${HOST_PORT_EXPLORER:-3001}:80"
    volumes:
      - ./deployments/privacy/nginx.privacy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      block-explorer-api:
        condition: service_started
    networks:
      - public
      # Frontend also needs trust-zone access to reach block-explorer-api
      # on the internal network.
      - trust-zone
    restart: unless-stopped

  # Expose privacy-proxy on the host too, so clients hitting
  # localhost:${HOST_PORT_PROXY} work for testing.
  #
  # In production deployments the reverse proxy / ingress is the only
  # host-exposed surface, so you'd drop the port publish block on
  # proxy-backend and publish only the ingress.

networks:
  # Trust zone — privacy-proxy is the only service that spans out to the
  # public network. The chain-indexer, its postgres, anvil (or any real
  # EVM node), and redis are NOT reachable from clients.
  trust-zone:
    driver: bridge
    internal: false   # proxy-backend needs NODE_URL egress; flip to true
                     # in prod if anvil/RPC is on the same network and
                     # there's no other external dependency.

  # Public zone — SPAs + the proxy-backend's exposed port. No direct
  # access to any data source.
  public:
    driver: bridge

volumes:
  privacy-postgres-data:
  indexer-postgres-data:
  block-explorer-postgres-data:
