server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy JSON-RPC requests to backend
    location /rpc {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    # Proxy Privado wallet callback to backend (not Azure callback - that's SPA)
    location = /auth/callback {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    # Proxy auth request/verify endpoints to backend
    location /auth/request {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    location /auth/verify {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback: all unknown paths render index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for fingerprinted assets (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
