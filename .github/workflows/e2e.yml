name: E2E Tests

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: |
          docker compose -p privacy-proxy-e2e -f docker-compose.e2e.yml up -d --build postgres anvil proxy-backend

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for proxy-backend to be healthy..."
          timeout 120 bash -c 'until docker compose -p privacy-proxy-e2e -f docker-compose.e2e.yml ps proxy-backend | grep -q "healthy"; do sleep 5; done'
          echo "All services are healthy"

      - name: Run E2E tests
        id: e2e-tests
        run: |
          docker compose -p privacy-proxy-e2e -f docker-compose.e2e.yml run --rm playwright npm test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/playwright/test-results/
          retention-days: 14

      - name: Stop services
        if: always()
        run: |
          docker compose -p privacy-proxy-e2e -f docker-compose.e2e.yml down -v
