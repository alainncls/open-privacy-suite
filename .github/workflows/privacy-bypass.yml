name: Privacy-Mode Bypass Closure (RD-855 Phase 4b)

# Runs the negative-network integration test that verifies the privacy-
# mode compose manifest closes the RD-855 bypass path. Because it brings
# up nine services (privacy-postgres, redis, anvil, chain-indexer,
# indexer-postgres, proxy-backend + frontend, block-explorer frontend)
# and takes 2-4 minutes, it's gated behind:
#   - Manual dispatch (workflow_dispatch)
#   - Weekly schedule (Mondays 07:00 UTC)
# Instead of running on every PR.
#
# When architectural changes touch the compose file, the Dockerfile,
# nginx config, or the indexer's gRPC surface, dispatch this workflow
# manually before merging to confirm the bypass is still closed.
#
# Public-fork behavior: the test needs the gateway-fm/chain-indexer and
# gateway-fm/block-explorer repos. A preflight job probes whether they
# are readable with the available token (CROSS_REPO_READ_TOKEN, falling
# back to GITHUB_TOKEN — sufficient once the sibling repos are public).
# On forks without access the test is skipped with a notice instead of
# failing. In the canonical gateway-fm/privacy-proxy repo a missing
# token FAILS the run on purpose: this is a scheduled security
# regression check and must not be silently disabled.
#
# Running the full test as a maintainer: either dispatch this workflow
# in the canonical repo, or locally clone chain-indexer and
# block-explorer as siblings of privacy-proxy and run
# `make test-privacy-bypass`.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'

jobs:
  preflight:
    name: Sibling-repo access check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-test: ${{ steps.check.outputs.run-test }}
    steps:
      - name: Check sibling repo readability
        id: check
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
          IS_CANONICAL: ${{ github.repository == 'gateway-fm/privacy-proxy' }}
        run: |
          unreadable=""
          for repo in gateway-fm/chain-indexer gateway-fm/block-explorer; do
            if ! gh api "repos/$repo" --silent; then
              unreadable="$unreadable $repo"
            fi
          done
          if [ -z "$unreadable" ]; then
            echo "run-test=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_CANONICAL" = "true" ]; then
            echo "::error::Sibling repos not readable:$unreadable. This scheduled security regression check must not be silently skipped in the canonical repo — restore the CROSS_REPO_READ_TOKEN secret (read-only access to the sibling repos)."
            exit 1
          else
            echo "::notice::Sibling repos not readable with the available token:$unreadable. Skipping the privacy-mode bypass test on this fork. It runs in the canonical gateway-fm/privacy-proxy repo (weekly schedule + manual dispatch); see the workflow header for how to run it locally."
            echo "run-test=false" >> "$GITHUB_OUTPUT"
          fi

  negative-network:
    name: Privacy-mode trust boundary
    needs: preflight
    if: needs.preflight.outputs.run-test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout privacy-proxy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: privacy-proxy

      - name: Checkout chain-indexer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: gateway-fm/chain-indexer
          ref: main
          path: chain-indexer
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout block-explorer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: gateway-fm/block-explorer
          ref: main
          path: block-explorer
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Show Docker version
        run: docker version && docker compose version

      - name: Run negative-network test
        working-directory: privacy-proxy
        run: make test-privacy-bypass

      - name: Dump compose logs on failure
        if: failure()
        working-directory: privacy-proxy
        run: docker compose -f docker-compose.privacy.yml -p privacy-bypass-test logs --tail=200 || true

      - name: Compose down
        if: always()
        working-directory: privacy-proxy
        run: docker compose -f docker-compose.privacy.yml -p privacy-bypass-test down -v || true
