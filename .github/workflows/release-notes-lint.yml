name: Release Notes Lint

# Enforces the canonical release-notes structure (see
# .claude/skills/release/SKILL.md) independently of whether the /release
# skill was used to author them. Runs when a release is published or its
# notes are edited, and fails the check if a required section is missing.

on:
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  lint:
    # Drafts have no stable published body yet — skip them.
    if: ${{ !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # A release event defaults checkout to the release's tag. Editing an
          # older release (tag predates this workflow/script) would check out a
          # tree without scripts/lint-release-notes.sh and fail before linting.
          # Pin to the default branch so edits always run the current linter.
          ref: ${{ github.event.repository.default_branch }}
      - name: Lint release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: printf '%s' "$RELEASE_BODY" | bash scripts/lint-release-notes.sh -
