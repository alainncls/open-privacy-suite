# Block-explorer frontend nginx config for PRIVACY MODE only.
#
# RD-855 thesis: block-explorer in privacy mode is frontend-only. It has no
# api service, no postgres, no indexer. Every data call goes to
# privacy-proxy, which handles redaction.
#
# Routes:
#   /api/*   -> privacy-proxy's explorer REST surface
#                (privacy-proxy applies RedactionEngine on the way out)
#   /ws      -> 404 (WebSocket subscriptions deferred; see RD-855)
#   /        -> static SPA (client-side routing via try_files fallback)
#
# Standalone mode uses a different config that routes /api/* and /ws to
# the local block-explorer api service. That config lives in the
# block-explorer repo and is the default for that project's own
# docker-compose.yml. This privacy-mode file REPLACES it at runtime via a
# bind mount from privacy-proxy's docker-compose.privacy.yml.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # All API calls go to privacy-proxy, which proxies explorer reads to
  # chain-indexer and applies per-viewer redaction before responding.
  # Path rewrite: block-explorer frontend calls /api/blocks, /api/txs
  # etc.; privacy-proxy serves these under /api/v1/explorer/. Adjust
  # here if the path layout diverges.
  location /api/ {
    proxy_pass http://proxy-backend:8080/api/v1/explorer/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Privacy-proxy already enforces rate limits per viewer; don't
    # double-up here.
    proxy_read_timeout 60s;
  }

  # WebSocket streaming is deferred in privacy mode. RD-855 rejects
  # filter-based WS leaks and no replacement is wired yet. Return 404 so
  # SPA code that accidentally attempts to open a subscription fails fast
  # instead of silently hanging.
  location = /ws {
    return 404;
  }

  # Runtime config (non-static) — never cache.
  location = /config.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Static assets — fingerprinted; cache aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback. index.html is never cached so a new build is picked
  # up immediately.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
