# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes vs the base file:
#   - Backend/frontend use production build targets (no mock auth, compiled frontend)
#   - Internal services (postgres, anvil) lose their host port bindings
#   - Caddy is added as the sole public-facing service (TLS via Let's Encrypt)
#   - Dev-only flags (MOCK_SIGNATURES, ALLOW_MOCK_LOGIN) are disabled
#   - Secrets (JWT_SECRET, DATABASE_URL, VERIFIER_ID) must be provided via environment — no defaults
#
# Required environment variables (no defaults — server will refuse to start without these):
#   BASE_URL                e.g. https://proxy.yourdomain.com
#   JWT_SECRET              openssl rand -hex 32
#   JWT_REFRESH_SECRET      openssl rand -hex 32
#   ADMIN_API_TOKEN         openssl rand -hex 32
#   VERIFIER_ID             your Privado verifier DID
#   DATABASE_URL            postgres://user:pass@host:5432/privacy_proxy?sslmode=require

services:
  postgres:
    ports: !reset []   # Internal only — accessed by backend via Docker network

  anvil:
    ports: !reset []   # Internal only — accessed by backend via Docker network

  proxy-backend:
    build:
      target: prod     # Production binary (no mockauth build tag)
    ports: !reset []   # Accessed by Caddy via Docker network only
    environment:
      - ENVIRONMENT=production
      - MOCK_SIGNATURES=false
      - ALLOW_MOCK_LOGIN=false
      - DEMO_AUTO_AUTH_DELAY=
      - ENABLE_RUNTIME_TRACING=true
      - ENABLE_TRAVEL_RULE=true
      # Secrets — must be set in host environment, no fallback defaults in production
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - VERIFIER_ID=${VERIFIER_ID}
      - DATABASE_URL=${DATABASE_URL}
      # BASE_URL drives OAuth callbacks and must match the public Caddy domain
      - BASE_URL=${BASE_URL}
      # FRONTEND_URL must be HTTPS in production — config.Validate() enforces this.
      # With Caddy serving both frontend and backend on the same domain, set to BASE_URL.
      - FRONTEND_URL=${BASE_URL}
      # Restrict CORS to the actual frontend origin
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-${BASE_URL}}

  proxy-frontend:
    build:
      target: prod     # Compiled React app served by nginx
    ports: !reset []   # Accessed by Caddy via Docker network only
    volumes: !reset [] # No hot-reload mounts in production
    environment:
      - VITE_API_TARGET=   # Not used in prod (nginx doesn't proxy; Caddy does)
      - VITE_BACKEND_URL=  # Not used in prod (all calls are relative /api/...)
      - VITE_ALLOW_MOCK_LOGIN=false

  # TLS-terminating reverse proxy — the only service that binds public ports
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"          # HTTP (ACME HTTP-01 challenge + redirect to HTTPS)
      - "443:443"        # HTTPS
      - "443:443/udp"    # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data         # Persists Let's Encrypt certs
      - caddy-config:/config
    environment:
      # BASE_URL must be set — no default, Caddy will provision a cert for this domain
      - BASE_URL=${BASE_URL}
    depends_on:
      proxy-backend:
        condition: service_started
      proxy-frontend:
        condition: service_started
    networks:
      - proxy-network

volumes:
  caddy-data:
  caddy-config:
